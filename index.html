<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 28px 18px; color: #f4f6ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(ellipse at 18% 18%, rgba(77,205,230,.20), transparent 38%),
      radial-gradient(ellipse at 85% 82%, rgba(172,126,255,.20), transparent 40%),
      linear-gradient(145deg, #0b1020, #171c35 55%, #101426);
  }
  main { width: min(100%, 440px); text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
    color: #b9c5e8; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #67d9e8; box-shadow: 0 0 14px #67d9e8; }
  h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); font-weight: 650; letter-spacing: .04em; }
  .subtitle { margin: 10px 0 26px; color: #aab4d2; font-size: 14px; }
  .panel {
    padding: clamp(17px, 5vw, 25px); border: 1px solid rgba(255,255,255,.16);
    border-radius: 26px; background: rgba(255,255,255,.96);
    box-shadow: 0 24px 80px rgba(0,0,0,.34), 0 0 45px rgba(99,205,230,.10);
  }
  .qr { display: block; width: 100%; height: auto; border-radius: 12px; }
  .hint { margin: 18px 0 2px; color: #252b42; font-size: 17px; font-weight: 600; }
  .foot { margin-top: 20px; color: #8f9ab9; font-size: 12px; letter-spacing: .04em; }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise .65s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
